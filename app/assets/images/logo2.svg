<!-- Icon-only; size via class -->
<svg class="h-10 w-10" viewBox="0 0 200 200" aria-label="BankEncore logo"
     style="
      --c1: var(--color-primary, var(--p));
      --on-c1: var(--color-primary-content, var(--pc));
      --c2: var(--color-accent, var(--a));
      --on-c2: var(--color-accent-content, var(--ac));
      --c3: var(--color-secondary, var(--s));
      --on-c3: var(--color-secondary-content, var(--sc));
     " xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="var(--c1)" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="var(--c1)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Building -->
  <rect x="50" y="70" width="100" height="80" rx="10" ry="10" fill="url(#beGrad)"/>
  <!-- Doors -->
  <rect x="65" y="100" width="15" height="50" rx="2" fill="var(--on-c1)"/>
  <rect x="120" y="100" width="15" height="50" rx="2" fill="var(--on-c1)"/>
  <!-- Roof -->
  <polygon points="40 70 160 70 150 40 50 40" fill="var(--c2)"/>

  <!-- Accent seal with plus -->
  <circle cx="150" cy="50" r="30" fill="var(--c3)"/>
  <rect x="145" y="35" width="10" height="30" rx="5" ry="5" fill="var(--on-c3)"/>
  <rect x="135" y="45" width="30" height="10" rx="5" ry="5" fill="var(--on-c3)"/>
</svg>
