<!-- bankencore-stacked.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="BankEncore">
  <style>
    :root { color: var(--color-base-content); }
    .ink { stroke: var(--color-primary); fill: none; }
    .accent { fill: var(--color-accent); }
    .word { fill: currentColor; }
  </style>

  <!-- Monogram BE -->
  <g transform="translate(24,24)">
    <!-- Outer B with rounded bowls -->
    <path class="ink" vector-effect="non-scaling-stroke"
          d="M32,8  V144
             H96  a28,28 0 0 0 0,-56
             H32
             M32,96 H96 a28,28 0 0 0 0,-56 H32"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle E bar (accent) -->
    <rect class="accent" x="40" y="72" width="76" height="22" rx="11"/>
  </g>

  <!-- Stacked wordmark -->
  <g class="word" transform="translate(220,82)">
    <text x="0" y="0"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
      font-weight="700" font-size="72" letter-spacing="0.5">Bank</text>
    <text x="0" y="68"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
      font-weight="700" font-size="72" letter-spacing="0.5">Encore</text>
  </g>
</svg>
