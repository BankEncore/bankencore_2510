<!-- bankencore-horizontal.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="BankEncore">
  <style>
    :root { color: var(--color-base-content); }
    .ink { stroke: var(--color-primary); fill: none; }
    .accent { fill: var(--color-accent); }
    .word { fill: currentColor; }
  </style>

  <!-- Monogram -->
  <g transform="translate(24,16)">
    <path class="ink" vector-effect="non-scaling-stroke"
          d="M32,8 V120 H96 a28,28 0 0 0 0,-56 H32
             M32,80 H96 a28,28 0 0 0 0,-56 H32"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="accent" x="40" y="58" width="76" height="22" rx="11"/>
  </g>

  <!-- Wordmark -->
  <text class="word"
        x="220" y="96"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-weight="700" font-size="72" letter-spacing="0.5">
    Bank Encore
  </text>
</svg>
