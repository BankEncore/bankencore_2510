name: Bug Report
about: Something broke or behaves unexpectedly
title: "[Bug] "
labels: type/bug
body:
  - type: input
    attributes:
      label: Environment
      description: e.g., dev / test / prod
  - type: textarea
    attributes:
      label: Steps to Reproduce
  - type: textarea
    attributes:
      label: Expected Behavior
  - type: textarea
    attributes:
      label: Actual Behavior
  - type: textarea
    attributes:
      label: Logs / Screenshots
